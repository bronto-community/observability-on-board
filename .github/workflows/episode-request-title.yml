name: title episode requests

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  retitle:
    if: contains(github.event.issue.labels.*.name, 'episode-request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const body = context.payload.issue.body ?? '';
            const m = body.match(/### Tool\s*\n+([^\n]+)/);
            if (!m) return;
            const tool = m[1].trim();
            if (!tool || tool === '_No response_') return;
            await github.rest.issues.update({
              ...context.repo,
              issue_number: context.payload.issue.number,
              title: `Episode request: ${tool}`,
            });
