<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Fonts for the build-time OG images (src/pages/og). sharp renders SVG text through
     fontconfig, which only sees this directory when FONTCONFIG_PATH points here. -->
<fontconfig>
  <dir prefix="relative">.</dir>
  <cachedir prefix="relative">.cache</cachedir>
</fontconfig>
